<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar and smooth transitions */
        .task-enter {
            animation: fadeInScale 0.3s ease-out forwards;
        }
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen py-10 px-4 sm:px-6 flex items-center justify-center">

    <div class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-white/50 p-6 sm:p-8 transition-all duration-300">
        
        <!-- App Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">My Tasks</h1>
                <p class="text-xs text-gray-500 mt-0.5">Stay organized and productive today</p>
            </div>
            <div class="bg-indigo-100 text-indigo-700 font-semibold text-xs px-3 py-1.5 rounded-full shadow-inner">
                <span id="pending-count">0</span> remaining
            </div>
        </div>

        <form id="todo-form" class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="todo-input" 
                placeholder="What needs to be done?" 
                autocomplete="off"
                class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm"
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium px-5 py-3 rounded-xl transition-all shadow-md shadow-indigo-200 flex items-center justify-center"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
            </button>
        </form>

        <div class="flex bg-gray-100/80 p-1 rounded-xl mb-6 text-xs font-medium text-gray-600">
            <button data-filter="all" class="filter-btn flex-1 py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition-all">All</button>
            <button data-filter="active" class="filter-btn flex-1 py-2 rounded-lg hover:text-gray-900 transition-all">Active</button>
            <button data-filter="completed" class="filter-btn flex-1 py-2 rounded-lg hover:text-gray-900 transition-all">Completed</button>
        </div>

        <div class="space-y-3 mb-6 max-h-[340px] overflow-y-auto pr-1" id="todo-list">
            <!-- Dynamic task items will populate here -->
        </div>

        <!-- Empty state placeholder -->
        <div id="empty-state" class="hidden text-center py-8">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
            </div>
            <p class="text-sm font-medium text-gray-600">No tasks found</p>
            <p class="text-xs text-gray-400 mt-0.5">Enjoy your free time or add a new task above!</p>
        </div>

        <!-- Footer Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-gray-100 text-xs text-gray-500">
            <span id="task-stats">0 tasks total</span>
            <button id="clear-completed" class="hover:text-red-600 transition-colors">Clear completed</button>
        </div>
    </div>

    <script>
        // DOM Element references
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const pendingCount = document.getElementById('pending-count');
        const taskStats = document.getElementById('task-stats');
        const clearCompletedBtn = document.getElementById('clear-completed');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Application State
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentFilter = 'all';

        // Initialize application on load
        function init() {
            renderTodos();
            setupEventListeners();
        }

        // Setup event listeners for forms, filters and buttons
        function setupEventListeners() {
            todoForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = todoInput.value.trim();
                if (text !== '') {
                    addTodo(text);
                    todoInput.value = '';
                }
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                        b.classList.add('hover:text-gray-900');
                    });
                    btn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                    btn.classList.remove('hover:text-gray-900');
                    
                    currentFilter = btn.getAttribute('data-filter');
                    renderTodos();
                });
            });

            clearCompletedBtn.addEventListener('click', () => {
                todos = todos.filter(todo => !todo.completed);
                saveAndRender();
            });
        }

        // Add a new task item
        function addTodo(text) {
            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false
            };
            todos.unshift(newTodo);
            saveAndRender();
        }

        // Toggle task completion status
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveAndRender();
        }

        // Delete specific task by id
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveAndRender();
        }

        // Save state to localStorage and re-render UI
        function saveAndRender() {
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        // Render task items based on active filter
        function renderTodos() {
            todoList.innerHTML = '';

            // Filter tasks
            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            // Show empty state if list is empty
            const emptyState = document.getElementById('empty-state');
            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // Build task cards
            filteredTodos.forEach(todo => {
                const item = document.createElement('div');
                item.className = `task-enter flex items-center justify-between p-3.5 bg-gray-50/80 hover:bg-gray-100/80 border border-gray-100 rounded-xl transition-all group`;
                
                item.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0 pr-2">
                        <input 
                            type="checkbox" 
                            ${todo.completed ? 'checked' : ''} 
                            onclick="toggleTodo(${todo.id})"
                            class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer"
                        >
                        <span class="text-sm text-gray-700 truncate select-none ${todo.completed ? 'line-through text-gray-400' : ''}">
                            ${escapeHTML(todo.text)}
                        </span>
                    </div>
                    <button 
                        onclick="deleteTodo(${todo.id})" 
                        class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1.5 rounded-lg hover:bg-white shadow-xs"
                        title="Delete task"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                todoList.appendChild(item);
            });

            // Update stats counters
            const activeCount = todos.filter(t => !t.completed).length;
            pendingCount.textContent = activeCount;
            taskStats.textContent = `${todos.length} task${todos.length === 1 ? '' : 's'} total`;
        }

        // Helper function for security against XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Trigger initialization on load
        window.onload = init;
    </script>
</body>
</html>
